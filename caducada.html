<style>
  /* Aviso de propuesta caducada: la home entera, en su marco, ya fuera de alcance */
  @font-face { font-family: 'Gloock'; src: url('assets/fonts/gloock-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Manrope'; src: url('assets/fonts/manrope.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  :root {
    --noche: #0f131f; --noche-2: #1c2130; --noche-3: #2b3242; --basalto: #35415b; --pizarra: #727f9f; --cal: #e3e7f0; --blanco: #fff; --led: #f3d9a4;
    --margen: clamp(20px, 5vw, 72px);
    --muelle: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
    --salida: cubic-bezier(.16, 1, .3, 1);
    --alto: min(58svh, 540px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: radial-gradient(70% 60% at 70% 75%, rgba(53, 65, 91, .45), transparent 70%), var(--noche); color: var(--cal); font: 400 17px/1.7 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img, svg { display: block; max-width: 100%; }
  .cab { padding: clamp(18px, 3svh, 28px) var(--margen) 0; }
  .cab svg { height: clamp(40px, 5svh, 56px); width: auto; fill: var(--blanco); }
  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--margen)); margin-inline: auto; padding: clamp(32px, 6svh, 72px) var(--margen) clamp(40px, 7svh, 80px); display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(44px, 7svh, 64px); align-items: center; }
  .texto { display: grid; gap: clamp(26px, 4svh, 40px); justify-items: start; }
  h1 { font: 400 clamp(30px, 1.2rem + 2.6vw, 56px)/1.1 'Gloock', Georgia, serif; color: var(--blanco); max-width: 20ch; text-wrap: balance; }
  .mas { font-size: clamp(18px, 1rem + .5vw, 22px); color: var(--cal); max-width: 34em; }
  .mas a { color: var(--blanco); font-weight: 700; text-decoration-color: var(--led); text-underline-offset: .18em; overflow-wrap: anywhere; }
  .mas a:hover { color: var(--led); }
  .mas a:focus-visible { outline: 2px solid var(--cal); outline-offset: 3px; }
  /* La píldora de la home: al pasar, la luz cálida entra barriendo */
  .btn { position: relative; display: inline-flex; isolation: isolate; overflow: hidden; border-radius: 999px; text-decoration: none; font: 700 16px/1.1 'Manrope', system-ui, sans-serif; transition: transform .5s var(--muelle); }
  .btn::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; background: var(--led); transform: scaleX(0); transform-origin: 0 50%; transition: transform .55s var(--salida); }
  .btn span { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; color: var(--noche); }
  .btn { background: var(--cal); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .btn:hover { transform: translateY(-2px); }
  .btn:hover::before { transform: scaleX(1); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 2px solid var(--cal); outline-offset: 4px; }
  /* La home entera en su marco: pasa despacio, de arriba abajo */
  .vitrina { justify-self: center; display: grid; justify-items: center; margin: 0; }
  .ventana { display: block; width: min(320px, 72vw); height: var(--alto); overflow: hidden; border-radius: 12px; background: #111; box-shadow: 0 0 0 2px var(--led), 0 0 0 10px rgba(243, 217, 164, .1), 0 24px 60px -12px rgba(0, 0, 0, .7); }
  .ventana:focus-visible { outline: 2px solid var(--cal); outline-offset: 14px; }
  figcaption { margin-top: 22px; font-size: 14.5px; color: var(--pizarra); }
  @media (min-width: 900px) { .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); } .vitrina { justify-self: end; } }
  @keyframes recorrer { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @keyframes entrar { from { opacity: 0; transform: translateY(18px); } }
  @keyframes subir { from { opacity: 0; transform: translateY(24px) scale(.96); } }
  @media (prefers-reduced-motion: no-preference) {
    .ventana img { animation: recorrer 52s ease-in-out 1.4s infinite alternate; }
    .vitrina:hover .ventana img, .ventana:focus img { animation-play-state: paused; }
    .texto > * { animation: entrar .9s var(--salida) both; }
    .texto > :nth-child(2) { animation-delay: .12s; } .texto > :nth-child(3) { animation-delay: .24s; }
    .ventana { animation: subir 1s var(--muelle) both; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
